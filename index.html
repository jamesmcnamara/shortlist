<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shortlist</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17202a; background: #f5f3ef; }
      body { max-width: 680px; margin: 0 auto; padding: 12vh 24px; }
      h1 { margin-bottom: 8px; font-size: 2.5rem; letter-spacing: -0.05em; }
      p { color: #68707a; }
      form { display: flex; gap: 8px; margin: 32px 0; }
      input, button { border: 1px solid #d9d5cf; border-radius: 8px; padding: 11px 13px; font: inherit; }
      input[type="text"] { flex: 1; }
      input[type="number"] { width: 90px; }
      button { cursor: pointer; background: #17202a; color: white; border-color: #17202a; }
      li { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #dedbd5; }
      li button { padding: 5px 9px; background: transparent; color: #68707a; border-color: #d9d5cf; }
      #message { min-height: 1.5em; color: #a23b32; }
    </style>
  </head>
  <body>
    <h1>Movie shortlist</h1>
    <p>Keep track of what to watch next.</p>
    <form id="movie-form">
      <input id="title" type="text" placeholder="Movie title" required />
      <input id="year" type="number" min="1888" max="2200" placeholder="Year" />
      <button>Add</button>
    </form>
    <div id="message" role="status"></div>
    <ul id="movies"></ul>
    <script>
      const list = document.querySelector("#movies");
      const message = document.querySelector("#message");
      const form = document.querySelector("#movie-form");

      function showMessage(text = "") { message.textContent = text; }
      function render(items) {
        list.innerHTML = items.map(movie => `
          <li><span>${escapeHtml(movie.title)}${movie.year ? ` (${movie.year})` : ""}</span>
            <button data-id="${movie.id}" aria-label="Remove ${escapeHtml(movie.title)}">Remove</button>
          </li>`).join("");
      }
      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[character]));
      }
      async function load() {
        const response = await fetch("/api/movies");
        const data = await response.json();
        if (!response.ok) throw new Error(data.error);
        render(data);
      }
      form.addEventListener("submit", async event => {
        event.preventDefault();
        showMessage();
        const response = await fetch("/api/movies", {
          method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ title: document.querySelector("#title").value, year: document.querySelector("#year").value })
        });
        const data = await response.json();
        if (!response.ok) return showMessage(data.error);
        form.reset();
        load().catch(error => showMessage(error.message));
      });
      list.addEventListener("click", async event => {
        if (!event.target.matches("button")) return;
        const response = await fetch(`/api/movies?id=${event.target.dataset.id}`, { method: "DELETE" });
        if (!response.ok) {
          const data = await response.json();
          return showMessage(data.error);
        }
        load().catch(error => showMessage(error.message));
      });
      load().catch(error => showMessage(error.message));
    </script>
  </body>
</html>
